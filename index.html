<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>public internet sound storage</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-top: 1em;
      text-align: center;
    }

    .middle {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .number {
      margin-bottom: 1em;
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 0;
      justify-content: center;
    }

    .zero {
      display: flex;
      justify-content: center;
    }

    .controls {
      margin-top: 1em;
      display: flex;
      gap: 0.5em;
    }

    footer {
      margin-bottom: 1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div>public internet sound storage</div>
    <div style="margin-top:1em;">
      <button>choose file</button>
    </div>
  </header>

  <div class="middle">
    <div id="number" class="number">104</div>

    <div>
      <div class="pad">
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
      </div>
      <div class="zero">
        <button onclick="add('0')">0</button>
      </div>
    </div>

    <div class="controls">
      <button>prev</button>
      <button>play</button>
      <button>next</button>
    </div>
  </div>

  <footer>
    <a href="https://otherllc.com/">© 2026 other llc</a>
  </footer>

  <script>
    let value = "104";
    function add(n) {
      value += n;
      document.getElementById("number").textContent = value;
    }
  </script>
</body>
</html>
